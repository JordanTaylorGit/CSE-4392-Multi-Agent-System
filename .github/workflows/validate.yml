name: validate

on: [push, pull_request]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check harness tests scripts/render_activity.py
      - run: uv run pytest -q tests .agents/testgen/tests

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: skill graph is complete
        run: python3 scripts/validate_skills.py
      - name: json schemas parse
        run: |
          for f in schemas/*.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done

  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [original, refactored]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: build ${{ matrix.target }}
        working-directory: java
        run: mvn -B -P ${{ matrix.target }} test
