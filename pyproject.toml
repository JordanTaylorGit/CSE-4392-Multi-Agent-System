[project]
name = "cse4392-multi-agent-system"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "jsonschema>=4.20,<5",
    "langchain-ollama>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1.2.22,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]

[dependency-groups]
dev = [
    "pillow>=12,<13",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests", ".agents/testgen/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
